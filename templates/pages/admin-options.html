{{template "base" .}}

{{define "meta"}}
    <title>Admin — Quote Options</title>
    <meta name="robots" content="noindex">
{{end}}

{{define "content"}}
    <div class="page-header">
        <div class="container">
            <div class="section-label">Administration</div>
            <h1 class="section-title">Quote Options</h1>
            {{template "admin-nav" .Path}}
        </div>
    </div>

    <section class="admin-section" id="options">
        <div class="container">
            <p class="quote-group-desc">Base platform cost and the feature groups shown on the <a href="/quote">instant quote</a> form.</p>
            <div id="admin-app"></div>

            <div class="admin-actions">
                <button type="button" id="btn-add-group" class="btn btn--ghost">+ Add Group</button>
                <button type="button" id="btn-save" class="btn btn--primary">Save All Changes</button>
            </div>

            <div id="admin-status" class="admin-status" style="display:none;"></div>
        </div>
    </section>

    <script>window.__GROUPS__ = {{.PageData.GroupsJSON}};window.__BASE_COST__ = {{.PageData.BaseCost}};window.__CSRF__ = {{.CSRF}};</script>
    <script src="{{asset "js/admin.js"}}"></script>
{{end}}
